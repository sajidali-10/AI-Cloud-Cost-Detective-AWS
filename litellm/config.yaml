# litellm/config.yaml — Phase 7A real-provider-ready configuration.
#
# The application talks to LiteLLM exclusively through the stable
# internal alias `cost-analyst`.  The actual provider model and
# credentials are resolved by the LiteLLM gateway from environment
# variables at startup — no secrets appear in this file, and no
# operator-typed creds are required for the gateway to boot in a
# safe, AI-disabled-by-default mode.
#
# Required to enable a real provider:
#
#   LITELLM_API_KEY=<your-provider-key>
#   LITELLM_MODEL=openai/gpt-4o-mini        # or any LiteLLM-supported provider/model
#
# The alias `cost-analyst` keeps frontend and backend code stable
# regardless of which provider the operator wires in.

model_list:
  - model_name: cost-analyst
    litellm_params:
      model: os.environ/LITELLM_MODEL
      api_key: os.environ/LITELLM_API_KEY

litellm_settings:
  drop_params: true
  telemetry: false
  request_timeout: 30

general_settings:
  # Persist LiteLLM metadata + spend tracking in the litellm PostgreSQL DB.
  database_url_env: DATABASE_URL

router_settings:
  num_retries: 1
  timeout: 30
