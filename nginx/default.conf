# nginx/default.conf — only public entry point.
# - /         → frontend (static)
# - /api/     → backend (FastAPI on internal :8000)
# Future WebSocket proxying: $connection_upgrade map is defined and applied.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # Reasonable defaults; not security headers yet (Phase 0).
    client_max_body_size 10m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # ---- Frontend static ----
    location / {
        proxy_pass http://frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Backend API ----
    # Strip the /api prefix so the backend sees clean paths (/health, /health/ready, ...).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    # ---- Backend WebSocket ----
    # Phase 5C: realtime conversation channel.
    #
    #  * Same /api/ prefix-stripping convention as the REST surface
    #    so the backend sees /ws/conversations/{id} (and the WS
    #    router is mounted at prefix /ws/conversations).
    #  * Generous read/send timeouts because an AI generation may
    #    legitimately take up to ``AI_REQUEST_TIMEOUT_SECONDS + 5``
    #    seconds and the WebSocket is expected to stay open across
    #    many round-trips.  The values are large enough for AI
    #    calls but small enough that nginx eventually drops
    #    genuinely dead connections.
    #  * The bearer token travels in the ``Sec-WebSocket-Protocol``
    #    header (``bearer.<jwt>``) — NEVER in the URL — so nginx
    #    ``access_log`` records the request path WITHOUT the token.
    location /api/ws/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # ---- Health endpoint for Nginx itself ----
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
