# nginx/default.conf — Phase 8.1 production HTTPS reverse proxy.
#
#   :80  → permanent redirect to https://<host>/* (never serves the SPA)
#   :443 → TLS termination (TLS 1.2/1.3 only, HTTP/2 on), serves SPA and
#          proxies /api/* + /api/ws/* to the backend
#
# Production hostname: finops.hiplink.com
# Certificate files are operator-managed at /etc/finops/tls/ on the host
# and mounted read-only at /etc/nginx/tls/ inside this container.  See
# docs/phase8-1-https-nginx.md for install + renewal procedures.
#
# Phase 7B sensitive-path hardening is preserved verbatim — it runs in
# every server block via the http-context maps below.

# ---------------------------------------------------------------------------
# http-context maps (must live in `http {}` scope)
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Block access to obviously sensitive paths.
#   /.env, /.aws/, /.git/, /terraform.tfstate, /docker-compose*, etc.
# Returns 404 from nginx itself, never reaches the frontend or backend.
map $uri $is_sensitive_path {
    default 0;
    ~^/\.env                1;
    ~^/\.aws                1;
    ~^/\.git                1;
    ~^/\.gitconfig          1;
    ~^/\.terraform          1;
    ~^/\.htaccess           1;
    ~^/\.htpasswd           1;
    ~^/\.npmrc              1;
    ~^/\.yarnrc             1;
    ~^/\.ssh                1;
    ~^/\.docker             1;
    ~^/\.kube               1;
    ~^/\.bash_history       1;
    ~^/\.bashrc             1;
    ~^/\.profile            1;
    ~^/\.zsh_history        1;
    ~^/\.well-known/security 1;
    ~^/terraform\.tfstate   1;
    ~\.tfstate$             1;
    ~^/docker-compose       1;
    ~^/Dockerfile           1;
    ~^/secrets\.(json|ya?ml)$ 1;
    ~^/phpinfo\.php         1;
    ~^/server-status        1;
    ~^/server-info          1;
    ~^/wp-admin             1;
    ~^/wp-login             1;
    ~^/xmlrpc\.php          1;
}

# ---------------------------------------------------------------------------
# :80  — HTTP virtual host.
#
# Strategy: serve the SPA + /api/ only when the Host header is a known
# internal/test name (localhost, 127.0.0.1, the EC2 private DNS, or the
# bare EC2 IP).  Every other Host — including finops.hiplink.com — gets a
# permanent redirect to HTTPS, preserving path and query string.  This
# keeps the internal Phase 7 release validator working on http://localhost
# while forcing production traffic onto HTTPS.
#
# The internal Phase 7D.5 validator explicitly targets http://localhost;
# per the Phase 8.1 spec §17, internal release testing may continue to
# use HTTP when that path is intentionally separate from the public
# HTTPS endpoint.  No public Host (i.e. finops.hiplink.com, *.hiplink.com)
# is ever served over plaintext.
# ---------------------------------------------------------------------------
map $host $is_internal_host {
    default                         0;
    "localhost"                     1;
    # Loopback IPv4 — 127.0.0.0/8.  The full 127/8 range is reserved
    # for loopback, but we only need to whitelist the host-side addresses
    # that an operator might actually use from the EC2 instance itself
    # (e.g. curl http://127.0.0.1, http://127.0.0.53/systemd-resolved).
    # A bare public IPv4 (e.g. the Elastic IP) is NOT internal and must
    # not serve the SPA over plaintext.
    "127.0.0.1"                     1;
    "127.0.0.53"                    1;
    "::1"                           1;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Lighter resource limits.
    client_max_body_size 10m;
    proxy_read_timeout   60s;
    proxy_send_timeout   60s;
    proxy_http_version 1.1;

    # Always-on security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer" always;
    types { } default_type application/octet-stream;

    # Sensitive-path hardening (Phase 7B preserved verbatim).
    if ($is_sensitive_path) {
        return 404;
    }
    location ~ ^/\. {
        return 404;
    }

    # Nginx self-health.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Production Host header → permanent HTTPS redirect.
    #
    # NOTE: nginx's `if` at server scope is "evil" — once any matching
    # location exists, the server-scope `if` is bypassed.  The correct
    # pattern is to place the conditional `return` inside `location /`
    # (and other public-facing locations).  The first matching location
    # that handles the URI runs the redirect-or-serve decision.
    #
    # Internal/test hosts (localhost, 127.0.0.1, 127.0.0.53, ::1) → serve
    # SPA + /api/ over plain HTTP, exactly like Phase 7.  This preserves
    # the Phase 7D.5 regression path.
    #
    # Any other Host header (production hostname, bare public IP, etc.)
    # is permanently redirected to HTTPS, preserving path and query.

    # Branding
    location /branding/ {
        if ($is_internal_host = 0) { return 301 https://$host$request_uri; }
        proxy_pass http://frontend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        if ($is_internal_host = 0) { return 301 https://$host$request_uri; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    # Backend WebSocket
    location /api/ws/ {
        if ($is_internal_host = 0) { return 301 https://$host$request_uri; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # Frontend SPA fallback
    location / {
        if ($is_internal_host = 0) { return 301 https://$host$request_uri; }
        proxy_pass http://frontend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# :443  — Production HTTPS reverse proxy.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Default server catches Host headers we do not serve.  We drop the
    # connection silently (444) so a misconfigured client never receives
    # the SPA under the wrong hostname.  The named vhost below serves the
    # real production hostname.
    server_name finops.hiplink.com;

    # ---------- TLS ----------
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # Modern protocol suite.  TLS 1.0 and 1.1 are explicitly disabled.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Mozilla "intermediate" cipher list (single source of truth, no need
    # to maintain a hand-curated list).  Nginx ships with this profile.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling — fires when the certificate supports it.
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---------- Resource + timeouts ----------
    client_max_body_size 10m;
    proxy_read_timeout   60s;
    proxy_send_timeout   60s;
    proxy_http_version 1.1;

    # ---------- Security headers (always — including 4xx) ----------
    # Suppress the Server banner version.  Stock nginx:1.27.4-alpine
    # does not include the `headers-more` module so we cannot strip the
    # `Server: nginx` string itself; `server_tokens off` is sufficient
    # for production hardening without adding an extra build dependency.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    # "strict-origin-when-cross-origin" is the conservative default that
    # still allows internal navigation.  Phase 7B used "no-referrer";
    # the production HTTPS path uses the slightly less strict value
    # because referer is required for some same-origin links to function
    # in modern browsers without breaking the SPA.
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(), payment=()" always;

    # HSTS activation policy
    # -----------------------------------------------------------------
    # Per docs/phase8-1-https-nginx.md §13, HSTS is NOT enabled until
    # live HTTPS has been validated against finops.hiplink.com with the
    # real `*.hiplink.com` wildcard certificate.  When validation
    # passes, uncomment the directive below:
    #
    #   add_header Strict-Transport-Security "max-age=31536000" always;
    #
    # Do NOT add `includeSubDomains` or `preload` in Phase 8.1 — that
    # would impose HTTPS-only policy on every `*.hiplink.com` vhost.
    # -----------------------------------------------------------------

    # Always-on SPA + sensitive-path rules (Phase 7B behaviour preserved).
    if ($is_sensitive_path) {
        return 404;
    }
    location ~ ^/\. {
        return 404;
    }

    # ---------- Branding ----------
    location /branding/ {
        proxy_pass http://frontend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto must be HTTPS — this vhost only listens on 443.
        proxy_set_header X-Forwarded-Proto https;
    }

    # ---------- Backend API ----------
    # /api/* and /api/ws/* strip the /api prefix so the backend sees clean
    # paths (/health, /auth/info, /aws/identity, ...).
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    # ---------- Backend WebSocket (Phase 5C) ----------
    location /api/ws/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # ---------- Frontend SPA ----------
    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ---------- Nginx self-health ----------
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ---------------------------------------------------------------------------
# :443  — default_server catch-all.
# Silently drops requests whose Host: header is not finops.hiplink.com.
# 444 closes the connection without a response — no leakage, no SPA
# exposure under a wrong hostname.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 444 — connection closed without a response.
    return 444;
}
