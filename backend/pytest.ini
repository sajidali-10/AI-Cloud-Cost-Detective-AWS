[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# NOTE on the cache directory:
#
# pytest defaults ``cache_dir`` to ``<rootdir>/.pytest_cache``.  In
# the container we run as the non-root ``app`` user, which CANNOT
# create a new directory under ``/app`` (owned by root).  The
# Dockerfile therefore pre-creates ``/app/.pytest_cache`` and
# ``chown``s it to ``app`` so the default cache path Just Works.
# We do NOT set ``cache_dir`` here because that would break local
# development (where ``<rootdir>/.pytest_cache`` is the right path).
addopts = -ra -q
filterwarnings =
    ignore::DeprecationWarning
asyncio_mode = auto
