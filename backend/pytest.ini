[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# NOTE on the cache directory:
#
# pytest defaults ``cache_dir`` to ``<rootdir>/.pytest_cache``.  In
# the container we run as the non-root ``app`` user, which CANNOT
# create a new directory under ``/app`` (owned by root).  The
# Dockerfile therefore pre-creates ``/app/.pytest_cache`` and
# ``chown``s it to ``app`` so the default cache path Just Works.
# We do NOT set ``cache_dir`` here because that would break local
# development (where ``<rootdir>/.pytest_cache`` is the right path).
addopts = -ra -q
filterwarnings =
    ignore::DeprecationWarning
asyncio_mode = auto
# Pin the default async-fixture loop scope to ``function`` so every
# async fixture / @pytest.mark.asyncio test gets its own loop.  This
# is the pytest-asyncio 0.24 future default and the least surprising
# choice for a codebase that does not rely on shared loop-scoped
# fixtures.  No existing test in the project overrides the loop
# scope, so this is purely a forward-compatibility setting that also
# silences ``PytestDeprecationWarning: asyncio_default_fixture_loop_scope
# is unset``.
asyncio_default_fixture_loop_scope = function
