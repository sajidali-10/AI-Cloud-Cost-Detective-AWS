# Alembic configuration for AI Cloud Cost Detective — Phase 2.
#
# The actual database URL is supplied at runtime by ``alembic/env.py``
# via :func:`app.core.config.get_settings` — DO NOT hardcode the
# production DSN here.  The placeholder below exists only so the
# config loader does not crash before env.py overrides it.

[alembic]
script_location = alembic
prepend_sys_path = .
# Overridden at runtime by env.py -> get_settings().database_url
sqlalchemy.url = postgresql+psycopg://placeholder:placeholder@localhost:5432/placeholder

# File template: <rev>_<slug>.  We pin the revision id (0001_cost_cache)
# in the file itself; alembic uses it as the version identifier.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
